name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project if uploaded as ZIP
        run: |
          if [ -f ai-video-studio-project.zip ]; then
            unzip -q -o ai-video-studio-project.zip
            shopt -s dotglob nullglob
            mv ai-video-studio/* . 2>/dev/null || true
            rmdir ai-video-studio 2>/dev/null || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-studio-apk
          path: app/build/outputs/apk/debug/app-debug.apk
